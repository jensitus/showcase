spring:
  profiles:
    active: dev
  application:
    name: workflow-showcase
  liquibase:
    enabled: true
    change-log: classpath:/db/db.changelog-master.yaml
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        connection:
          provider_disables_autocommit: true
    show-sql: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5555/workflow}
    password: ${DB_PASSWORD:insurance}
    username: ${DB_USERNAME:insurance}
    hikari:
      auto-commit: false
  mail:
    host: ${SMTP_HOST:smtp.protonmail.ch}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:info@service-b.org}
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm-please-change-this-in-production}
  expiration: 86400000  # 24 hours in milliseconds

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}

logging:
  level:
    # io.camunda.zeebe.client.impl.ZeebeCallCredentials: ERROR
    org.springframework.security: TRACE
    org.springframework.web.filter: DEBUG
    org.service_b.workflow.security.jwt: DEBUG

workerId: ${WORKER_ID:test}

tasklist:
  base-url: ${CIBSEVEN_BASE_URL:http://localhost:7001/engine-rest}

cibseven:
  base-url: ${CIBSEVEN_BASE_URL:http://localhost:7001/engine-rest}

workflow-service:
  base-url: ${WORKFLOW_SERVICE_URL:http://localhost:8080}

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}

showcase:
  # Set to true to simulate a task creation failure (triggers CIB Seven incident).
  # MUST be false in production.
  simulate-task-failure: false

novelty:
  # Novelty pipeline API on the Spark. Demo: via the SSH tunnel (local 8090 -> Spark 8080).
  # Real run: a direct network path to the Spark.
  #
  # 8090 serves the PubMed corpora, 8092 the congress ones. A congress batch needs 8092
  # AND an explicit "corpus" in the trigger; the default is left at 8090 so the
  # documented synthetic demo keeps working unchanged. Getting this pair wrong fails
  # loudly (400 unknown corpus) rather than screening against the wrong thing:
  #   NOVELTY_API_BASE_URL=http://localhost:8092  + {"corpus":"congress-A2"}
  api-base-url: ${NOVELTY_API_BASE_URL:http://localhost:8090}
  # 50, not 500. The pipeline screens ~0.5-0.6/s, so a 500-chunk takes ~15 min during
  # which the dashboard shows nothing and any failure re-screens all 500. At 50, results
  # append about every 90s so progress is visible, a failure is cheap, and the 30-minute
  # per-chunk deadline goes from ~3x headroom to ~20x.
  chunk-size: ${NOVELTY_CHUNK_SIZE:50}
  tenant: ${NOVELTY_TENANT:screening}
